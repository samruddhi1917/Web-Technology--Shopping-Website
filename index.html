<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ShopEase - a simple responsive shopping website demo." />
  <title>ShopEase | Smart Shopping Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/home" aria-label="ShopEase home"><span class="brand-mark">S</span> ShopEase</a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/shop" data-route="shop">Shop</a>
      <a href="#/cart" data-route="cart">Cart <span class="cart-count" id="cartCount">0</span></a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
  </header>

  <main id="app" tabindex="-1">
    <!-- JavaScript renders the selected SPA view here. -->
  </main>

  <footer class="site-footer">
    <div><a class="brand footer-brand" href="#/home"><span class="brand-mark">S</span> ShopEase</a>
      <p>A student mini project demonstrating a responsive shopping portal.</p></div>
    <p>© <span id="year"></span> ShopEase. Demo website for educational use.</p>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
